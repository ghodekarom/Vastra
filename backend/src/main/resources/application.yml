server:
  port: 8080

spring:
  application:
    name: vastra-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/vastra
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

vastra:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 Hours
    refresh-expiration-ms: 604800000 # 7 Days

  commerce:
    free-shipping-threshold: 1999.00
    standard-shipping-fee: 99.00
    express-shipping-fee: 199.00
    return-window-days: 7

  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
